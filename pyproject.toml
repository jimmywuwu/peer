[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peer"
version = "0.1.0"
description = "Tick-based agent operating loop and contractual collaboration primitives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jimmy Wu" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
